name: RC Fix Document Dedupe Race

on:
  push:
    branches:
      - release/eos-4.0-rc1
    paths:
      - .github/workflows/rc-fix-document-dedupe-race.yml

permissions:
  contents: write

jobs:
  fix-dedupe:
    if: ${{ !contains(github.event.head_commit.message, '[skip document-dedupe-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/eos-4.0-rc1
          fetch-depth: 0

      - name: Make duplicate insert race idempotent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/api/documents/ingest/route.ts')
          text = path.read_text()
          anchor = '      uploadedPaths.length = 0;\n\n      return NextResponse.json(\n        { error: "El archivo se subió, pero no pudimos registrarlo en EOS." },\n        { status: 500, headers: noStoreHeaders() },\n      );'
          replacement = '      uploadedPaths.length = 0;\n\n      if (insertError?.code === "23505") {\n        const { data: concurrentDuplicate, error: concurrentDuplicateError } =\n          await admin\n            .from("eos_documents_v11")\n            .select(\n              "id,nombre,mime_type,document_type,extraction_status,intelligence_status,summary,storage_path,created_at",\n            )\n            .eq("usuario_id", user.id)\n            .eq("checksum_sha256", checksum)\n            .maybeSingle();\n\n        if (!concurrentDuplicateError && concurrentDuplicate) {\n          return NextResponse.json(\n            { ok: true, duplicate: true, document: concurrentDuplicate },\n            { headers: noStoreHeaders() },\n          );\n        }\n\n        if (concurrentDuplicateError) {\n          console.error(\n            "No se pudo recuperar duplicado documental concurrente:",\n            concurrentDuplicateError,\n          );\n        }\n      }\n\n      return NextResponse.json(\n        { error: "El archivo se subió, pero no pudimos registrarlo en EOS." },\n        { status: 500, headers: noStoreHeaders() },\n      );'

          count = text.count(anchor)
          if count != 1:
              raise SystemExit(f'Expected exactly one insert error anchor; found {count}')
          path.write_text(text.replace(anchor, replacement, 1))
          PY

          git diff --check
          git diff -- app/api/documents/ingest/route.ts

      - name: Commit exact dedupe fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api/documents/ingest/route.ts
          git commit -m 'fix(documents): recover concurrent duplicate uploads [skip document-dedupe-fix]'
          git push origin HEAD:release/eos-4.0-rc1
