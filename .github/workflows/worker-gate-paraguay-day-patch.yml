name: Worker Gate Paraguay Day Patch

on:
  push:
    branches:
      - agent/eos-rc1-api-boundary-hardening
    paths:
      - .github/workflows/worker-gate-paraguay-day-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/eos-rc1-api-boundary-hardening
          fetch-depth: 0

      - name: Align Worker Gate daily limits to Paraguay
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('lib/worker-gate-handler.ts')
          text = path.read_text()

          old = '''function startOfUtcDay() {\n  const now = new Date();\n  return new Date(\n    Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()),\n  ).toISOString();\n}\n'''
          new = '''const AUTONOMY_TIME_ZONE = "America/Asuncion";\n\nfunction dateInTimeZone(value: string, timeZone = AUTONOMY_TIME_ZONE) {\n  const parts = new Intl.DateTimeFormat("en-US", {\n    timeZone,\n    year: "numeric",\n    month: "2-digit",\n    day: "2-digit",\n  }).formatToParts(new Date(value));\n  const values = Object.fromEntries(parts.map((part) => [part.type, part.value]));\n  return `${values.year}-${values.month}-${values.day}`;\n}\n\nfunction recentAutonomyWindowStart() {\n  return new Date(Date.now() - 30 * 60 * 60 * 1000).toISOString();\n}\n'''
          if old not in text:
            raise SystemExit('startOfUtcDay snippet missing')
          text = text.replace(old, new, 1)

          old = '''      admin\n        .from("eos_autonomy_events_v12")\n        .select("event_type,detail")\n        .eq("usuario_id", usuarioId)\n        .eq("event_type", "auto_allowed")\n        .gte("created_at", startOfUtcDay()),\n'''
          new = '''      admin\n        .from("eos_autonomy_events_v12")\n        .select("event_type,detail,created_at")\n        .eq("usuario_id", usuarioId)\n        .eq("event_type", "auto_allowed")\n        .gte("created_at", recentAutonomyWindowStart()),\n'''
          if old not in text:
            raise SystemExit('daily worker query snippet missing')
          text = text.replace(old, new, 1)

          old = '''    const autoEvents = dailyEventsResult.data || [];\n    const autoCount = autoEvents.length;\n'''
          new = '''    const autonomyDay = dateInTimeZone(new Date().toISOString());\n    const autoEvents = (dailyEventsResult.data || []).filter(\n      (event: any) => dateInTimeZone(event.created_at) === autonomyDay,\n    );\n    const autoCount = autoEvents.length;\n'''
          if old not in text:
            raise SystemExit('autoEvents worker snippet missing')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Verify Worker Gate day alignment
        run: |
          grep -F 'AUTONOMY_TIME_ZONE = "America/Asuncion"' lib/worker-gate-handler.ts
          grep -F 'recentAutonomyWindowStart()' lib/worker-gate-handler.ts
          grep -F 'dateInTimeZone(event.created_at) === autonomyDay' lib/worker-gate-handler.ts
          if grep -F 'startOfUtcDay' lib/worker-gate-handler.ts; then exit 1; fi

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/worker-gate-handler.ts
          git commit -m 'fix(worker-gate): align daily autonomy limits to Paraguay'
          git push origin HEAD:agent/eos-rc1-api-boundary-hardening
