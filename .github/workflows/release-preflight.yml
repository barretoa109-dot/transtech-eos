name: Release Preflight

on:
  pull_request:
    branches:
      - main
      - release/eos-4.0-rc1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: TypeScript
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Quality gate
        if: always()
        run: |
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.typecheck.outcome }}" = "success"
