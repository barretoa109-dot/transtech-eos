name: RC Fix Document Extraction Status

on:
  push:
    branches:
      - release/eos-4.0-rc1
    paths:
      - .github/workflows/rc-fix-document-extraction-status.yml

permissions:
  contents: write

jobs:
  fix-status:
    if: ${{ !contains(github.event.head_commit.message, '[skip document-status-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/eos-4.0-rc1
          fetch-depth: 0

      - name: Fix extraction failure state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/api/documents/ingest/route.ts')
          text = path.read_text()
          replacements = [
              ('status: "ready" | "partial" | "unsupported";', 'status: "ready" | "partial" | "unsupported" | "error";'),
              ('status: "partial",\n        language: null,\n        metadata: {\n          extractor: "error",', 'status: "error",\n        language: null,\n        metadata: {\n          extractor: "error",'),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match for {old!r}; found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          git diff --check
          git diff -- app/api/documents/ingest/route.ts

      - name: Commit exact status fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api/documents/ingest/route.ts
          git commit -m 'fix(documents): mark extraction failures as errors [skip document-status-fix]'
          git push origin HEAD:release/eos-4.0-rc1
