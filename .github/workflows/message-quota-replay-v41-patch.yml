name: Message Quota Replay v41 Patch

on:
  push:
    branches:
      - agent/eos-rc1-message-quota-v40
    paths:
      - .github/workflows/message-quota-replay-v41-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/eos-rc1-message-quota-v40
          fetch-depth: 0

      - name: Patch replay response boundary
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('app/api/eos/route.ts')
          text = path.read_text()

          old = '''      const code = typeof quota.code === "string" ? quota.code : "EOS_MESSAGE_NOT_ALLOWED";\n      const isLimit = code === "EOS_MESSAGE_LIMIT_REACHED";\n      const isFree = quota.plan === "free";\n      return Response.json(\n        {\n          respuesta: isLimit\n            ? isFree\n              ? "Llegaste a tus 5 mensajes gratuitos de hoy. Tu cupo se renueva mañana según la hora de Paraguay. Si querés seguir ahora, podés elegir un plan en Planes."\n              : "Llegaste al límite de mensajes de tu plan actual. Podés revisar tus opciones en Planes."\n            : "Tu suscripción no permite enviar mensajes en este momento. Revisá tu plan para continuar.",\n          code,\n          commercial: quota,\n          upgrade_url: "/planes",\n        },\n        {\n          status: isLimit ? 429 : 402,\n'''
          new = '''      const code = typeof quota.code === "string" ? quota.code : "EOS_MESSAGE_NOT_ALLOWED";\n      const isLimit = code === "EOS_MESSAGE_LIMIT_REACHED";\n      const isInProgress = code === "EOS_MESSAGE_REQUEST_IN_PROGRESS";\n      const isConsumedReplay = code === "EOS_MESSAGE_REQUEST_ALREADY_CONSUMED";\n      const isReplayConflict = isInProgress || isConsumedReplay;\n      const isFree = quota.plan === "free";\n      return Response.json(\n        {\n          respuesta: isLimit\n            ? isFree\n              ? "Llegaste a tus 5 mensajes gratuitos de hoy. Tu cupo se renueva mañana según la hora de Paraguay. Si querés seguir ahora, podés elegir un plan en Planes."\n              : "Llegaste al límite de mensajes de tu plan actual. Podés revisar tus opciones en Planes."\n            : isInProgress\n              ? "Este mensaje ya se está procesando. Esperá la respuesta antes de volver a enviarlo."\n              : isConsumedReplay\n                ? "Este mensaje ya fue procesado. Para continuar, enviá un mensaje nuevo."\n                : "Tu suscripción no permite enviar mensajes en este momento. Revisá tu plan para continuar.",\n          code,\n          commercial: quota,\n          ...(isLimit || !isReplayConflict ? { upgrade_url: "/planes" } : {}),\n        },\n        {\n          status: isReplayConflict ? 409 : isLimit ? 429 : 402,\n'''
          if old not in text:
            raise SystemExit('replay boundary marker missing')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Patch chat replay messages
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('app/eos/hooks/useChat.ts')
          text = path.read_text()

          old = '''        const commercialError =\n          error instanceof EOSApiError\n          && ["EOS_MESSAGE_LIMIT_REACHED", "EOS_SUBSCRIPTION_INACTIVE"].includes(error.code);\n        const respuestaError = commercialError\n          ? error.message\n          : "Ahora mismo no pude conectarme correctamente. Probá nuevamente en unos segundos.";\n\n        const mensajeError: Mensaje = {\n          id: crearIdMensaje(commercialError ? "plan" : "error"),\n          rol: "eos",\n          texto: respuestaError,\n          estado: commercialError ? "completado" : "error",\n          tipo: "texto",\n          accion: commercialError ? "ABRIR_PLANES" : "RESPONDER",\n'''
          new = '''        const commercialError =\n          error instanceof EOSApiError\n          && ["EOS_MESSAGE_LIMIT_REACHED", "EOS_SUBSCRIPTION_INACTIVE"].includes(error.code);\n        const replayConflict =\n          error instanceof EOSApiError\n          && ["EOS_MESSAGE_REQUEST_IN_PROGRESS", "EOS_MESSAGE_REQUEST_ALREADY_CONSUMED"].includes(error.code);\n        const userFacingError = commercialError || replayConflict;\n        const respuestaError = userFacingError\n          ? error.message\n          : "Ahora mismo no pude conectarme correctamente. Probá nuevamente en unos segundos.";\n\n        const mensajeError: Mensaje = {\n          id: crearIdMensaje(commercialError ? "plan" : replayConflict ? "estado" : "error"),\n          rol: "eos",\n          texto: respuestaError,\n          estado: userFacingError ? "completado" : "error",\n          tipo: "texto",\n          accion: commercialError ? "ABRIR_PLANES" : "RESPONDER",\n'''
          if old not in text:
            raise SystemExit('useChat replay marker missing')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Verify replay guard integration
        run: |
          grep -F 'EOS_MESSAGE_REQUEST_IN_PROGRESS' app/api/eos/route.ts
          grep -F 'EOS_MESSAGE_REQUEST_ALREADY_CONSUMED' app/api/eos/route.ts
          grep -F 'status: isReplayConflict ? 409' app/api/eos/route.ts
          grep -F 'replayConflict' app/eos/hooks/useChat.ts
          grep -F 'userFacingError' app/eos/hooks/useChat.ts

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api/eos/route.ts app/eos/hooks/useChat.ts
          git commit -m 'fix(commercial): block quota request replay at API boundary'
          git push origin HEAD:agent/eos-rc1-message-quota-v40
