name: app-nativa

# Que la app de Android y la de iOS COMPILEN (01/10/2026).
#
# La app es un WebView de Capacitor que carga transtech.com.py (ver
# docs/app-nativa/tiendas.md). Esto no firma ni publica: comprueba que los
# proyectos nativos compilan después de cada cambio, y deja un APK de prueba
# para instalar en un Android antes de tener la cuenta de Google Play.
# Firmar y subir a las tiendas necesita las cuentas de Apple y Google (dueño).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - "ios/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "assets/**"
      - ".github/workflows/app-nativa.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Compilar el APK de prueba
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: eos-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      # AAB de release para Google Play. Si el secreto EOS_UPLOAD_KEYSTORE_B64
      # no está cargado, sale sin firmar (compila, pero no se puede subir).
      - name: Decodificar la clave de subida
        if: ${{ secrets.EOS_UPLOAD_KEYSTORE_B64 != '' }}
        run: echo "${{ secrets.EOS_UPLOAD_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Compilar el AAB de release
        working-directory: android
        env:
          EOS_UPLOAD_KEYSTORE: ${{ secrets.EOS_UPLOAD_KEYSTORE_B64 != '' && format('{0}/upload.jks', runner.temp) || '' }}
          EOS_UPLOAD_STORE_PASSWORD: ${{ secrets.EOS_UPLOAD_STORE_PASSWORD }}
          EOS_UPLOAD_KEY_ALIAS: ${{ secrets.EOS_UPLOAD_KEY_ALIAS }}
          EOS_UPLOAD_KEY_PASSWORD: ${{ secrets.EOS_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: eos-android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap sync ios
      - name: Compilar para el simulador (sin firma)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App \
            -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test "${PIPESTATUS[0]}" -eq 0
