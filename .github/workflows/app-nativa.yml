name: app-nativa

# Que la app de Android y la de iOS COMPILEN (01/10/2026).
#
# La app es un WebView de Capacitor que carga transtech.com.py (ver
# docs/app-nativa/tiendas.md). Esto no firma ni publica: comprueba que los
# proyectos nativos compilan después de cada cambio, y deja un APK de prueba
# para instalar en un Android antes de tener la cuenta de Google Play.
# Firmar y subir a las tiendas necesita las cuentas de Apple y Google (dueño).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - "ios/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "assets/**"
      - ".github/workflows/app-nativa.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # El contexto `secrets` no se puede usar en un `if:` (lo bloquea GitHub
    # Actions). Por eso se vuelca a una variable de entorno acá, una sola vez.
    env:
      TIENE_CLAVE_DE_SUBIDA: ${{ secrets.EOS_UPLOAD_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Compilar el APK de prueba
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: eos-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      # AAB de release para Google Play. Si el secreto EOS_UPLOAD_KEYSTORE_B64
      # no está cargado, sale sin firmar (compila, pero no se puede subir).
      - name: Decodificar la clave de subida
        if: ${{ env.TIENE_CLAVE_DE_SUBIDA == 'true' }}
        run: echo "${{ secrets.EOS_UPLOAD_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Compilar el AAB de release
        working-directory: android
        env:
          EOS_UPLOAD_KEYSTORE: ${{ env.TIENE_CLAVE_DE_SUBIDA == 'true' && format('{0}/upload.jks', runner.temp) || '' }}
          EOS_UPLOAD_STORE_PASSWORD: ${{ secrets.EOS_UPLOAD_STORE_PASSWORD }}
          EOS_UPLOAD_KEY_ALIAS: ${{ secrets.EOS_UPLOAD_KEY_ALIAS }}
          EOS_UPLOAD_KEY_PASSWORD: ${{ secrets.EOS_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: eos-android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

  ios:
    # Apple exige el SDK de iOS 26 (Xcode 26) para subir builds desde el
    # 26/10/2026; macos-15 solo trae hasta Xcode 16.4.
    runs-on: macos-26
    timeout-minutes: 40
    # Mismo truco que en el job de Android: `secrets` no se puede leer en un
    # `if:`, así que se vuelca a una variable una sola vez acá.
    env:
      TIENE_FIRMA_IOS: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_APP_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_SHARE_BASE64 != '' && secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap sync ios
      - name: Compilar para el simulador (sin firma)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App \
            -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test "${PIPESTATUS[0]}" -eq 0
      # ------------------------------------------------------------------
      # De acá para abajo, solo corre si están los siete secrets de firma
      # (ver ios/App/fastlane/Fastfile). Sin ellos, el job termina arriba:
      # compiló para el simulador, como siempre, y no intenta firmar nada.
      # ------------------------------------------------------------------
      - name: Decodificar el certificado, los perfiles y la clave de API
        if: ${{ env.TIENE_FIRMA_IOS == 'true' }}
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_PROVISIONING_PROFILE_APP_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_APP_BASE64 }}
          IOS_PROVISIONING_PROFILE_SHARE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_SHARE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          echo "$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64" | base64 -d -o "$RUNNER_TEMP/distribucion.p12"
          echo "$IOS_PROVISIONING_PROFILE_APP_BASE64" | base64 -d -o "$RUNNER_TEMP/app.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_SHARE_BASE64" | base64 -d -o "$RUNNER_TEMP/compartir.mobileprovision"
          echo "$APP_STORE_CONNECT_API_KEY_P8_BASE64" | base64 -d -o "$RUNNER_TEMP/asc-api-key.p8"
      - name: Instalar Fastlane
        if: ${{ env.TIENE_FIRMA_IOS == 'true' }}
        run: gem install fastlane --no-document
      - name: Archivar, firmar y subir a TestFlight
        if: ${{ env.TIENE_FIRMA_IOS == 'true' }}
        working-directory: ios/App
        env:
          EOS_IOS_CERT_PATH: ${{ runner.temp }}/distribucion.p12
          EOS_IOS_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          EOS_IOS_PROFILE_APP_PATH: ${{ runner.temp }}/app.mobileprovision
          EOS_IOS_PROFILE_SHARE_PATH: ${{ runner.temp }}/compartir.mobileprovision
          EOS_ASC_API_KEY_PATH: ${{ runner.temp }}/asc-api-key.p8
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: fastlane ios release
      - uses: actions/upload-artifact@v4
        if: ${{ env.TIENE_FIRMA_IOS == 'true' }}
        with:
          name: eos-ios-ipa
          path: ios/App/build/EOS.ipa
          retention-days: 30
