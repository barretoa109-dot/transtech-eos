name: RC Audit Fix Temporary

on:
  push:
    branches:
      - release/eos-4.0-rc1
    paths:
      - .github/workflows/rc-audit-fix-temporary.yml

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RC branch
        uses: actions/checkout@v4
        with:
          ref: release/eos-4.0-rc1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply non-breaking audit fixes to lockfile only
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund

      - name: Guard package policy
        run: |
          git diff --exit-code -- package.json
          node -e "const l=require('./package-lock.json'); if(l.packages['node_modules/xlsx']) process.exit(1); if(l.packages['node_modules/exceljs']?.version !== '4.4.0') process.exit(2);"

      - name: Show remaining audit
        run: npm audit --audit-level=high || true

      - name: Commit lockfile only
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): apply non-breaking audit fixes [skip audit-fix]"
          git push origin HEAD:release/eos-4.0-rc1
