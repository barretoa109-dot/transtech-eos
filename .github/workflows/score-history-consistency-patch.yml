name: Score History Consistency Patch

on:
  push:
    branches:
      - agent/eos-rc1-score-history-consistency
    paths:
      - .github/workflows/score-history-consistency-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/eos-rc1-score-history-consistency
          fetch-depth: 0

      - name: Patch Score response consistency
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('app/api/eos-kpis/route.ts')
          text = path.read_text()

          marker = '''  if (snapshotError) {\n    console.error("No se pudo persistir el EOS Intelligence Score:", snapshotError);\n  }\n\n  return NextResponse.json({\n'''
          replacement = '''  if (snapshotError) {\n    console.error("No se pudo persistir el EOS Intelligence Score:", snapshotError);\n  }\n\n  const comparableHistory = snapshots\n    .filter((item) => item.formula_version === FORMULA_VERSION);\n  const historyForResponse = snapshotError\n    ? comparableHistory\n    : [\n        ...comparableHistory.filter((item) => item.snapshot_day !== today),\n        {\n          snapshot_day: today,\n          score,\n          formula_version: FORMULA_VERSION,\n        } as Snapshot,\n      ];\n\n  return NextResponse.json({\n'''
          if marker not in text:
            raise SystemExit('snapshot marker missing')
          text = text.replace(marker, replacement, 1)

          old = '''    history: snapshots\n      .filter((item) => item.formula_version === FORMULA_VERSION)\n      .slice(0, 14)\n      .map((item) => ({ day: item.snapshot_day, score: item.score }))\n      .reverse(),\n    formula_version: FORMULA_VERSION,\n'''
          new = '''    history: historyForResponse\n      .sort((left, right) => right.snapshot_day.localeCompare(left.snapshot_day))\n      .slice(0, 14)\n      .map((item) => ({ day: item.snapshot_day, score: item.score }))\n      .reverse(),\n    persistence: {\n      snapshot_persisted: !snapshotError,\n      history_loaded: !history.error,\n    },\n    formula_version: FORMULA_VERSION,\n'''
          if old not in text:
            raise SystemExit('history response marker missing')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Verify focused Score changes
        run: |
          grep -F 'historyForResponse' app/api/eos-kpis/route.ts
          grep -F 'snapshot_persisted: !snapshotError' app/api/eos-kpis/route.ts
          grep -F 'history_loaded: !history.error' app/api/eos-kpis/route.ts
          grep -F 'comparableHistory.filter((item) => item.snapshot_day !== today)' app/api/eos-kpis/route.ts

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api/eos-kpis/route.ts
          git commit -m 'fix(score): keep current history consistent with live score'
          git push origin HEAD:agent/eos-rc1-score-history-consistency
