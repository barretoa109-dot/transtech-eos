name: RC XLSX E2E Temporary

on:
  push:
    branches:
      - release/eos-4.0-rc1
    paths:
      - .github/workflows/rc-xlsx-e2e-temporary.yml

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

jobs:
  xlsx-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RC branch
        uses: actions/checkout@v4
        with:
          ref: release/eos-4.0-rc1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Start app
        run: |
          npm start -- -p 3100 > /tmp/eos-next.log 2>&1 &
          echo $! > /tmp/eos-next.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/ >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/eos-next.log
          exit 1

      - name: Generate and validate XLSX through registered route
        run: |
          STATUS=$(curl -sS \
            -D /tmp/headers.txt \
            -o /tmp/control.xlsx \
            -w '%{http_code}' \
            'http://127.0.0.1:3100/descargar?tipo=excel&nombre=smoke_rc1&rubro=software&negocio=TransTech%20EOS')
          echo "HTTP_STATUS=$STATUS"
          cat /tmp/headers.txt
          test "$STATUS" = "200"
          grep -qi 'content-type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' /tmp/headers.txt
          grep -qi 'content-disposition: attachment; filename="smoke_rc1.xlsx"' /tmp/headers.txt
          node - <<'NODE'
          const fs = require('fs');
          const ExcelJS = require('exceljs');
          (async () => {
            const buffer = fs.readFileSync('/tmp/control.xlsx');
            if (buffer.length < 5000) throw new Error(`xlsx unexpectedly small: ${buffer.length}`);
            const wb = new ExcelJS.Workbook();
            await wb.xlsx.load(buffer);
            const expected = [
              'Dashboard EOS',
              'Ingresos',
              'Gastos fijos',
              'Gastos variables',
              'Productos',
              'Clientes',
              'Flujo de caja',
              'Diagnóstico EOS',
              'Configuración',
            ];
            const actual = wb.worksheets.map((sheet) => sheet.name);
            if (JSON.stringify(actual) !== JSON.stringify(expected)) {
              throw new Error(`unexpected sheets: ${JSON.stringify(actual)}`);
            }
            const productMargin = wb.getWorksheet('Productos').getCell('E2').value;
            if (!productMargin || typeof productMargin !== 'object' || productMargin.formula !== 'IFERROR((D2-C2)/D2,0)') {
              throw new Error(`Productos!E2 formula mismatch: ${JSON.stringify(productMargin)}`);
            }
            const dashboardUtility = wb.getWorksheet('Dashboard EOS').getCell('J9').value;
            if (!dashboardUtility || typeof dashboardUtility !== 'object' || dashboardUtility.formula !== 'E9-G9') {
              throw new Error(`Dashboard EOS!J9 formula mismatch: ${JSON.stringify(dashboardUtility)}`);
            }
            console.log(JSON.stringify({
              ok: true,
              bytes: buffer.length,
              sheets: actual.length,
              product_margin_formula: productMargin.formula,
              dashboard_utility_formula: dashboardUtility.formula,
            }));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Stop app
        if: always()
        run: |
          if [ -f /tmp/eos-next.pid ]; then kill $(cat /tmp/eos-next.pid) || true; fi
          tail -n 60 /tmp/eos-next.log || true
