name: Autonomy Calendar Patch

on:
  push:
    branches:
      - agent/eos-rc1-api-boundary-hardening
    paths:
      - .github/workflows/autonomy-calendar-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/eos-rc1-api-boundary-hardening
          fetch-depth: 0

      - name: Patch autonomy business-day and idempotency behavior
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('app/api/autonomy/evaluate/route.ts')
          text = path.read_text()

          old = '''function startOfUtcDay() {\n  const now = new Date();\n  return new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate())).toISOString();\n}\n'''
          new = '''const AUTONOMY_TIME_ZONE = "America/Asuncion";\n\nfunction dateInTimeZone(value: string, timeZone = AUTONOMY_TIME_ZONE) {\n  const parts = new Intl.DateTimeFormat("en-US", {\n    timeZone,\n    year: "numeric",\n    month: "2-digit",\n    day: "2-digit",\n  }).formatToParts(new Date(value));\n  const values = Object.fromEntries(parts.map((part) => [part.type, part.value]));\n  return `${values.year}-${values.month}-${values.day}`;\n}\n\nfunction recentAutonomyWindowStart() {\n  return new Date(Date.now() - 30 * 60 * 60 * 1000).toISOString();\n}\n'''
          if old not in text: raise SystemExit('startOfUtcDay snippet missing')
          text = text.replace(old, new, 1)

          old = '''        .from("eos_autonomy_events_v12")\n        .select("event_type,detail")\n        .eq("usuario_id", user.id)\n        .eq("event_type", "auto_allowed")\n        .gte("created_at", startOfUtcDay()),\n'''
          new = '''        .from("eos_autonomy_events_v12")\n        .select("event_type,detail,created_at")\n        .eq("usuario_id", user.id)\n        .eq("event_type", "auto_allowed")\n        .gte("created_at", recentAutonomyWindowStart()),\n'''
          if old not in text: raise SystemExit('daily query snippet missing')
          text = text.replace(old, new, 1)

          old = '''  const autoEvents = dailyEventsResult.data || [];\n  const autoCount = autoEvents.length;\n'''
          new = '''  const autonomyDay = dateInTimeZone(new Date().toISOString());\n  const autoEvents = (dailyEventsResult.data || []).filter(\n    (event) => dateInTimeZone(event.created_at) === autonomyDay,\n  );\n  const autoCount = autoEvents.length;\n'''
          if old not in text: raise SystemExit('autoEvents snippet missing')
          text = text.replace(old, new, 1)

          old = '''  if (priorEventError) {\n    console.error("No se pudo comprobar idempotencia de autonomía:", priorEventError);\n  } else if (priorEvents?.length) {\n'''
          new = '''  if (priorEventError) {\n    console.error("No se pudo comprobar idempotencia de autonomía:", priorEventError);\n    return NextResponse.json(\n      { error: "No pudimos verificar de forma segura si esta acción ya fue evaluada." },\n      { status: 503, headers: noStoreHeaders() },\n    );\n  } else if (priorEvents?.length) {\n'''
          if old not in text: raise SystemExit('idempotency snippet missing')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Verify patch
        run: |
          grep -F 'AUTONOMY_TIME_ZONE = "America/Asuncion"' app/api/autonomy/evaluate/route.ts
          grep -F 'recentAutonomyWindowStart()' app/api/autonomy/evaluate/route.ts
          grep -F 'dateInTimeZone(event.created_at) === autonomyDay' app/api/autonomy/evaluate/route.ts
          grep -F 'No pudimos verificar de forma segura si esta acción ya fue evaluada.' app/api/autonomy/evaluate/route.ts
          if grep -F 'startOfUtcDay' app/api/autonomy/evaluate/route.ts; then exit 1; fi

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api/autonomy/evaluate/route.ts
          git commit -m 'fix(autonomy): align daily limits to Paraguay and fail closed on idempotency'
          git push origin HEAD:agent/eos-rc1-api-boundary-hardening
