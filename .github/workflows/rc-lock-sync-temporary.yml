name: RC Lockfile Sync Temporary

on:
  push:
    branches:
      - release/eos-4.0-rc1
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/rc-lock-sync-temporary.yml

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RC branch
        uses: actions/checkout@v4
        with:
          ref: release/eos-4.0-rc1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate package-lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Assert dependency policy
        run: |
          node -e "const l=require('./package-lock.json'); if(l.packages['node_modules/xlsx']) process.exit(1); if(l.packages['node_modules/exceljs']?.version !== '4.4.0') process.exit(2);"

      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): sync ExcelJS 4.4 lockfile [skip lock-sync]"
          git push origin HEAD:release/eos-4.0-rc1
