name: Message Quota Cleanup v40 Patch

on:
  push:
    branches:
      - agent/eos-rc1-message-quota-v40
    paths:
      - .github/workflows/message-quota-cleanup-v40-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/eos-rc1-message-quota-v40
          fetch-depth: 0

      - name: Patch global quota cleanup
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('app/api/eos/route.ts')
          text = path.read_text()

          old = '''export async function POST(req: Request) {\n  try {\n'''
          new = '''export async function POST(req: Request) {\n  let releaseReservedQuota: ((reason: string) => Promise<void>) | null = null;\n\n  try {\n'''
          if old not in text:
            raise SystemExit('POST start marker missing')
          text = text.replace(old, new, 1)

          marker = '''    const releaseQuota = async (reason: string) => {\n      if (quotaReleased) return;\n      quotaReleased = true;\n      const { error: releaseError } = await supabase.rpc(\n        "eos_release_message_quota_v40",\n        { p_request_id: payload.request_id, p_reason: reason.slice(0, 160) },\n      );\n      if (releaseError) {\n        console.error("No se pudo liberar la reserva de mensaje EOS:", releaseError);\n      }\n    };\n\n'''
          replacement = marker + '''    releaseReservedQuota = releaseQuota;\n\n'''
          if marker not in text:
            raise SystemExit('release function marker missing')
          text = text.replace(marker, replacement, 1)

          marker = '''    if (!finalizeOk) {\n      console.error("EOS respondió, pero no se pudo confirmar el consumo:", finalizeError || finalizeRaw);\n      await releaseQuota("quota_finalize_failed");\n'''
          if marker not in text:
            raise SystemExit('finalize failure marker missing')

          marker = '''    try {\n      await fetch(\n        process.env.N8N_DECISION_CAPTURE_URL ||\n'''
          replacement = '''    quotaReleased = true;\n    releaseReservedQuota = null;\n\n    try {\n      await fetch(\n        process.env.N8N_DECISION_CAPTURE_URL ||\n'''
          if marker not in text:
            raise SystemExit('finalize success marker missing')
          text = text.replace(marker, replacement, 1)

          old = '''  } catch (error) {\n    const timeout =\n      error instanceof Error &&\n      (error.name === "TimeoutError" || error.name === "AbortError");\n\n    console.log("Error proxy EOS:", error);\n'''
          new = '''  } catch (error) {\n    const timeout =\n      error instanceof Error &&\n      (error.name === "TimeoutError" || error.name === "AbortError");\n\n    if (releaseReservedQuota) {\n      await releaseReservedQuota(timeout ? "unexpected_timeout" : "unexpected_proxy_error");\n      releaseReservedQuota = null;\n    }\n\n    console.log("Error proxy EOS:", error);\n'''
          if old not in text:
            raise SystemExit('outer catch marker missing')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Verify global cleanup
        run: |
          grep -F 'let releaseReservedQuota:' app/api/eos/route.ts
          grep -F 'releaseReservedQuota = releaseQuota' app/api/eos/route.ts
          grep -F 'releaseReservedQuota = null' app/api/eos/route.ts
          grep -F 'unexpected_proxy_error' app/api/eos/route.ts

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api/eos/route.ts
          git commit -m 'fix(commercial): release message reservation on unexpected proxy errors'
          git push origin HEAD:agent/eos-rc1-message-quota-v40
