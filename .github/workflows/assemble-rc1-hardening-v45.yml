name: Assemble RC1 Hardening Candidate v45

on:
  push:
    branches:
      - agent/eos-rc1-cumulative-validation
    paths:
      - .github/workflows/assemble-rc1-hardening-v45.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "rc1-assembly-bot"
          git config user.email "rc1-assembly@example.invalid"

      - name: Fetch RC and validated hardenings
        run: |
          git fetch origin release/eos-4.0-rc1
          git fetch origin agent/eos-rc1-consolidated-hardening-v45
          git fetch origin agent/eos-rc1-input-error-hardening
          git fetch origin agent/eos-rc1-payment-error-sanitization
          git fetch origin agent/eos-rc1-twin-atomic-snapshots
          git fetch origin agent/eos-rc1-dependency-hardening
          git fetch origin agent/eos-rc1-admin-payment-error-sanitization
          git fetch origin agent/eos-rc1-api-boundary-hardening
          git fetch origin agent/eos-rc1-business-twin-source-guard-v34
          git fetch origin agent/eos-rc1-document-analysis-atomic-v29
          git fetch origin agent/eos-rc1-master-context-atomic-v31
          git fetch origin agent/eos-rc1-decision-result-atomic-v32
          git fetch origin agent/eos-rc1-score-history-consistency
          git fetch origin agent/eos-rc1-download-route-hardening
          git fetch origin agent/eos-rc1-followup-briefing-hardening
          git fetch origin agent/eos-rc1-message-quota-v40

      - name: Assemble candidate from RC1
        run: |
          git checkout -B agent/eos-rc1-consolidated-hardening-v45 origin/release/eos-4.0-rc1
          git merge --no-ff --no-edit origin/agent/eos-rc1-input-error-hardening
          git merge --no-ff --no-edit origin/agent/eos-rc1-payment-error-sanitization
          git merge --no-ff --no-edit origin/agent/eos-rc1-twin-atomic-snapshots
          git merge --no-ff --no-edit origin/agent/eos-rc1-dependency-hardening
          git merge --no-ff --no-edit origin/agent/eos-rc1-admin-payment-error-sanitization
          git merge --no-ff --no-edit origin/agent/eos-rc1-api-boundary-hardening
          git merge --no-ff --no-edit origin/agent/eos-rc1-business-twin-source-guard-v34
          git merge --no-ff --no-edit origin/agent/eos-rc1-document-analysis-atomic-v29
          git merge --no-ff --no-edit origin/agent/eos-rc1-master-context-atomic-v31
          git merge --no-ff --no-edit origin/agent/eos-rc1-decision-result-atomic-v32
          git merge --no-ff --no-edit origin/agent/eos-rc1-score-history-consistency
          git merge --no-ff --no-edit origin/agent/eos-rc1-download-route-hardening
          git merge --no-ff --no-edit origin/agent/eos-rc1-followup-briefing-hardening
          git merge --no-ff --no-edit origin/agent/eos-rc1-message-quota-v40
          echo "Candidate head: $(git rev-parse HEAD)"

      - name: Push isolated candidate
        run: git push origin HEAD:refs/heads/agent/eos-rc1-consolidated-hardening-v45
