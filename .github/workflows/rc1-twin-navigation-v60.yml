name: RC1 Business Twin Navigation v60

on:
  push:
    branches:
      - release/eos-4.0-rc1
    paths:
      - .github/workflows/rc1-twin-navigation-v60.yml

permissions:
  contents: write

jobs:
  patch-twin-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/eos-4.0-rc1
          fetch-depth: 0

      - name: Integrate Business Twin into EOS shell
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('app/eos/types/chat.ts'): [
                  (
                      '  | "learnings"\n  | "dashboard"',
                      '  | "learnings"\n  | "twin"\n  | "dashboard"',
                  ),
              ],
              Path('app/eos/components/Sidebar.tsx'): [
                  (
                      'type Vista = "chat" | "briefing" | "context" | "decisions" | "learnings" | "dashboard" | "perfil";',
                      'type Vista = "chat" | "briefing" | "context" | "decisions" | "learnings" | "twin" | "dashboard" | "perfil";',
                  ),
                  (
                      '''          <NavButton\n            icono={<BrainCircuit size={18} />}\n            texto="Aprendizajes"\n            descripcion="Patrones comprobados"\n            activo={vista === "learnings"}\n            onClick={() => onVistaChange("learnings")}\n          />\n\n          <NavButton\n            icono={<BarChart3 size={18} />}''',
                      '''          <NavButton\n            icono={<BrainCircuit size={18} />}\n            texto="Aprendizajes"\n            descripcion="Patrones comprobados"\n            activo={vista === "learnings"}\n            onClick={() => onVistaChange("learnings")}\n          />\n\n          <NavButton\n            icono={<Network size={18} />}\n            texto="Business Twin"\n            descripcion="Modelo operativo vivo"\n            activo={vista === "twin"}\n            onClick={() => onVistaChange("twin")}\n          />\n\n          <NavButton\n            icono={<BarChart3 size={18} />}''',
                  ),
              ],
              Path('app/eos/chat/page.tsx'): [
                  (
                      'import MasterContextView from "../components/MasterContextView";\nimport DocumentsView',
                      'import MasterContextView from "../components/MasterContextView";\nimport BusinessTwinView from "../components/BusinessTwinView";\nimport DocumentsView',
                  ),
                  (
                      '''          {vista === "learnings" && usuarioCargado && <LearningsView />}\n\n          {vista === "perfil" && (''',
                      '''          {vista === "learnings" && usuarioCargado && <LearningsView />}\n\n          {vista === "twin" && usuarioCargado && <BusinessTwinView />}\n\n          {vista === "perfil" && (''',
                  ),
              ],
              Path('app/eos/components/BusinessTwinView.tsx'): [
                  (
                      '      if (!payload?.twin) {',
                      '      if (!payload?.twin || payload?.needs_refresh) {',
                  ),
              ],
          }

          for path, changes in replacements.items():
              text = path.read_text()
              for old, new in changes:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: replacement block count={count}; expected exactly 1')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY

      - name: Commit Business Twin integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/eos/types/chat.ts app/eos/components/Sidebar.tsx app/eos/chat/page.tsx app/eos/components/BusinessTwinView.tsx
          git diff --cached --check
          git commit -m "feat(twin): integrate live twin into EOS navigation"
          git push origin HEAD:release/eos-4.0-rc1
