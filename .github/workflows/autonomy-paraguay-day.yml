name: Autonomy Paraguay Day

on:
  push:
    branches:
      - agent/eos-rc1-autonomy-paraguay-day
    paths:
      - .github/workflows/autonomy-paraguay-day.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/eos-rc1-autonomy-paraguay-day
          fetch-depth: 0

      - name: Align autonomy daily budget with Paraguay day
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('app/api/autonomy/evaluate/route.ts')
          text = path.read_text(encoding='utf-8')

          old_helper = '''function startOfUtcDay() {
  const now = new Date();
  return new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate())).toISOString();
}'''
          new_helper = '''const PARAGUAY_DAY_FORMATTER = new Intl.DateTimeFormat("en-US", {
  timeZone: "America/Asuncion",
  year: "numeric",
  month: "2-digit",
  day: "2-digit",
});

function paraguayDayKey(value: Date) {
  const parts = PARAGUAY_DAY_FORMATTER.formatToParts(value);
  const year = parts.find((part) => part.type === "year")?.value || "";
  const month = parts.find((part) => part.type === "month")?.value || "";
  const day = parts.find((part) => part.type === "day")?.value || "";
  return `${year}-${month}-${day}`;
}

function autonomyEventLookbackStart() {
  // 36h safely covers the complete current Paraguay calendar day across timezone changes.
  return new Date(Date.now() - 36 * 60 * 60 * 1000).toISOString();
}'''

          old_query = '''      supabase
        .from("eos_autonomy_events_v12")
        .select("event_type,detail")
        .eq("usuario_id", user.id)
        .eq("event_type", "auto_allowed")
        .gte("created_at", startOfUtcDay()),'''
          new_query = '''      supabase
        .from("eos_autonomy_events_v12")
        .select("event_type,detail,created_at")
        .eq("usuario_id", user.id)
        .eq("event_type", "auto_allowed")
        .gte("created_at", autonomyEventLookbackStart()),'''

          old_events = '''  const autoEvents = dailyEventsResult.data || [];
  const autoCount = autoEvents.length;'''
          new_events = '''  const todayParaguay = paraguayDayKey(new Date());
  const autoEvents = (dailyEventsResult.data || []).filter((event) => {
    const createdAt = typeof event.created_at === "string" ? new Date(event.created_at) : null;
    return createdAt && !Number.isNaN(createdAt.getTime())
      ? paraguayDayKey(createdAt) === todayParaguay
      : false;
  });
  const autoCount = autoEvents.length;'''

          for label, old, new in [
              ('helper', old_helper, new_helper),
              ('query', old_query, new_query),
              ('events', old_events, new_events),
          ]:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 exact target, found {count}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          print('Autonomy Paraguay-day patch applied')
          PY

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Verify timezone semantics
        run: |
          node <<'NODE'
          const fmt = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Asuncion', year:'numeric', month:'2-digit', day:'2-digit' });
          const key = (value) => {
            const parts = fmt.formatToParts(value);
            const get = (t) => parts.find((p) => p.type === t)?.value || '';
            return `${get('year')}-${get('month')}-${get('day')}`;
          };
          const beforeMidnightPy = new Date('2026-08-13T02:59:59.000Z');
          const afterMidnightPy = new Date('2026-08-13T03:00:00.000Z');
          if (key(beforeMidnightPy) !== '2026-08-12') throw new Error(`Expected PY 2026-08-12, got ${key(beforeMidnightPy)}`);
          if (key(afterMidnightPy) !== '2026-08-13') throw new Error(`Expected PY 2026-08-13, got ${key(afterMidnightPy)}`);
          console.log('America/Asuncion midnight boundary PASS');
          NODE

      - name: Commit route hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api/autonomy/evaluate/route.ts
          git commit -m 'fix(autonomy): use Paraguay calendar day for daily limits'
          git push origin HEAD:agent/eos-rc1-autonomy-paraguay-day
