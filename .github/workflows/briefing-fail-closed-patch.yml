name: Briefing Fail Closed Patch

on:
  push:
    branches:
      - agent/eos-rc1-followup-briefing-hardening
    paths:
      - .github/workflows/briefing-fail-closed-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/eos-rc1-followup-briefing-hardening
          fetch-depth: 0

      - name: Patch Briefing API fail-closed behavior
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('app/api/briefing/route.ts')
          text = path.read_text()

          old = '''  const briefings = briefingResult.data ?? [];\n  const latest = briefings[0] ?? null;\n  const dailyLimit = preferencesResult.data?.max_alertas_dia ?? 3;\n  const minimumSeverity = normalizeSeverity(preferencesResult.data?.severidad_minima);\n  const minimumScore = { media: 40, alta: 70, critica: 90 }[minimumSeverity];\n  const attentionItems = (followupsResult.data ?? [])\n    .map(rankAttentionItem)\n    .filter((item) => item.score >= minimumScore)\n    .sort((left, right) => right.score - left.score)\n    .slice(0, dailyLimit);\n  const proactiveEnabled = preferencesResult.data?.habilitado !== false\n    && preferencesResult.data?.canal_web !== false;\n  const localHour = hourInTimeZone(preferencesResult.data?.zona_horaria ?? "America/Asuncion");\n  const quietHours = isWithinQuietHours(\n    localHour,\n    preferencesResult.data?.silencio_desde ?? 21,\n    preferencesResult.data?.silencio_hasta ?? 7,\n  );\n'''
          new = '''  const briefings = briefingResult.data ?? [];\n  const latest = briefings[0] ?? null;\n  const contextAvailable = !contextResult.error;\n  const followupsAvailable = !followupsResult.error;\n  const preferencesAvailable = !preferencesResult.error;\n  const attentionAvailable = followupsAvailable && preferencesAvailable;\n  const dailyLimit = attentionAvailable\n    ? preferencesResult.data?.max_alertas_dia ?? 3\n    : 0;\n  const minimumSeverity = normalizeSeverity(preferencesResult.data?.severidad_minima);\n  const minimumScore = { media: 40, alta: 70, critica: 90 }[minimumSeverity];\n  const attentionItems = attentionAvailable\n    ? (followupsResult.data ?? [])\n        .map(rankAttentionItem)\n        .filter((item) => item.score >= minimumScore)\n        .sort((left, right) => right.score - left.score)\n        .slice(0, dailyLimit)\n    : [];\n  const proactiveEnabled = attentionAvailable\n    && preferencesResult.data?.habilitado !== false\n    && preferencesResult.data?.canal_web !== false;\n  const localHour = attentionAvailable\n    ? hourInTimeZone(preferencesResult.data?.zona_horaria ?? "America/Asuncion")\n    : 0;\n  const quietHours = attentionAvailable\n    ? isWithinQuietHours(\n        localHour,\n        preferencesResult.data?.silencio_desde ?? 21,\n        preferencesResult.data?.silencio_hasta ?? 7,\n      )\n    : true;\n'''
          if old not in text:
            raise SystemExit('Briefing calculation block missing')
          text = text.replace(old, new, 1)

          text = text.replace(
            '''      master_context: contextResult.data ?? null,\n      attention: {\n        items: proactiveEnabled ? attentionItems : [],\n        total_pending: followupsResult.data?.length ?? 0,\n        suppressed_count: proactiveEnabled\n          ? Math.max(0, (followupsResult.data?.length ?? 0) - attentionItems.length)\n          : followupsResult.data?.length ?? 0,\n        daily_limit: dailyLimit,\n        interruption_recommended:\n          proactiveEnabled && !quietHours && attentionItems.some((item) => item.score >= 70),\n        quiet_hours: quietHours,\n      },\n      is_stale:\n''',
            '''      master_context: contextAvailable ? contextResult.data ?? null : null,\n      attention: {\n        available: attentionAvailable,\n        items: proactiveEnabled ? attentionItems : [],\n        total_pending: attentionAvailable ? followupsResult.data?.length ?? 0 : 0,\n        suppressed_count: attentionAvailable\n          ? proactiveEnabled\n            ? Math.max(0, (followupsResult.data?.length ?? 0) - attentionItems.length)\n            : followupsResult.data?.length ?? 0\n          : 0,\n        daily_limit: dailyLimit,\n        interruption_recommended:\n          attentionAvailable\n          && proactiveEnabled\n          && !quietHours\n          && attentionItems.some((item) => item.score >= 70),\n        quiet_hours: quietHours,\n      },\n      data_health: {\n        complete: contextAvailable && followupsAvailable && preferencesAvailable,\n        master_context: contextAvailable,\n        followups: followupsAvailable,\n        preferences: preferencesAvailable,\n      },\n      is_stale:\n''',
            1,
          )

          path.write_text(text)
          PY

      - name: Patch Briefing visual degraded state
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('app/eos/components/BriefingView.tsx')
          text = path.read_text()
          old = '''        {attention && attention.items.length > 0 && (\n'''
          new = '''        {attention?.available === false && (\n          <p className="briefing-error">\n            EOS no pudo verificar tus alertas y preferencias en este momento. No recomendará interrupciones hasta recuperar esa información.\n          </p>\n        )}\n\n        {attention && attention.available !== false && attention.items.length > 0 && (\n'''
          if old not in text:
            raise SystemExit('Briefing attention render marker missing')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify fail-closed behavior
        run: |
          grep -F 'const attentionAvailable = followupsAvailable && preferencesAvailable' app/api/briefing/route.ts
          grep -F 'available: attentionAvailable' app/api/briefing/route.ts
          grep -F 'complete: contextAvailable && followupsAvailable && preferencesAvailable' app/api/briefing/route.ts
          grep -F 'attentionAvailable' app/api/briefing/route.ts
          grep -F 'attention?.available === false' app/eos/components/BriefingView.tsx
          grep -F 'No recomendará interrupciones' app/eos/components/BriefingView.tsx

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api/briefing/route.ts app/eos/components/BriefingView.tsx
          git commit -m 'fix(briefing): fail closed when attention preferences are unavailable'
          git push origin HEAD:agent/eos-rc1-followup-briefing-hardening
