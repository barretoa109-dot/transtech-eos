name: API Error Sanitize

on:
  push:
    branches:
      - agent/eos-rc1-api-error-sanitization
    paths:
      - .github/workflows/api-error-sanitize.yml

permissions:
  contents: write

jobs:
  sanitize-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/eos-rc1-api-error-sanitization
          fetch-depth: 0

      - name: Sanitize client-facing 500 errors
        run: |
          python3 <<'PY'
          from pathlib import Path

          replacements = {
              Path('app/api/documents/[id]/analyze/route.ts'): (
'''    return NextResponse.json(
      {
        error:
          error instanceof Error
            ? error.message
            : "No se pudo analizar el documento.",
      },
      { status: 500, headers: noStoreHeaders() },
    );''',
'''    return NextResponse.json(
      { error: "No se pudo analizar el documento." },
      { status: 500, headers: noStoreHeaders() },
    );'''),
              Path('app/api/twin/refresh/route.ts'): (
'''    return NextResponse.json(
      {
        error:
          error instanceof Error
            ? error.message
            : "No se pudo actualizar el Business Twin.",
      },
      { status: 500, headers: noStoreHeaders() },
    );''',
'''    return NextResponse.json(
      { error: "No se pudo actualizar el Business Twin." },
      { status: 500, headers: noStoreHeaders() },
    );'''),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 target, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')
              print(f'{path}: sanitized')
          PY

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Verify no raw catch leak remains in targets
        run: |
          python3 <<'PY'
          from pathlib import Path
          for p in [Path('app/api/documents/[id]/analyze/route.ts'), Path('app/api/twin/refresh/route.ts')]:
              text = p.read_text(encoding='utf-8')
              tail = text[-1800:]
              if '? error.message' in tail or 'error.message\n' in tail:
                  raise SystemExit(f'raw error.message remains in final boundary: {p}')
          print('Target boundaries sanitized: PASS')
          PY

      - name: Commit route hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/api/documents/[id]/analyze/route.ts' 'app/api/twin/refresh/route.ts'
          git commit -m 'fix(api): sanitize document and twin error boundaries'
          git push origin HEAD:agent/eos-rc1-api-error-sanitization
