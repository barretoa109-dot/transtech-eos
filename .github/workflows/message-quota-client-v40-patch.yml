name: Message Quota Client v40 Patch

on:
  push:
    branches:
      - agent/eos-rc1-message-quota-v40
    paths:
      - .github/workflows/message-quota-client-v40-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/eos-rc1-message-quota-v40
          fetch-depth: 0

      - name: Patch useChat commercial errors and request id
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('app/eos/hooks/useChat.ts')
          text = path.read_text()

          text = text.replace(
            'import { enviarMensajeAEOS } from "../services/eosApi";',
            'import { EOSApiError, enviarMensajeAEOS } from "../services/eosApi";',
            1,
          )

          marker = '''        const resultadoEOS = await enviarMensajeAEOS({\n'''
          replacement = '''        const requestId = crypto.randomUUID();\n        const resultadoEOS = await enviarMensajeAEOS({\n'''
          if marker not in text:
            raise SystemExit('send marker missing')
          text = text.replace(marker, replacement, 1)

          marker = '''          nuevoChat: historialParaContexto.length === 0,\n          imagen,\n'''
          replacement = '''          nuevoChat: historialParaContexto.length === 0,\n          requestId,\n          imagen,\n'''
          if marker not in text:
            raise SystemExit('requestId argument marker missing')
          text = text.replace(marker, replacement, 1)

          marker = '''        await cargarBriefing(usuarioId);\n      } catch (error) {\n'''
          replacement = '''        await cargarBriefing(usuarioId);\n        window.dispatchEvent(new Event("eos:usage-changed"));\n      } catch (error) {\n'''
          if marker not in text:
            raise SystemExit('success refresh marker missing')
          text = text.replace(marker, replacement, 1)

          old = '''        const respuestaError =\n          "Ahora mismo no pude conectarme correctamente. Probá nuevamente en unos segundos.";\n\n        const mensajeError: Mensaje = {\n          id: crearIdMensaje("error"),\n          rol: "eos",\n          texto: respuestaError,\n          estado: "error",\n          creado_en: new Date().toISOString(),\n        };\n'''
          new = '''        const commercialError =\n          error instanceof EOSApiError\n          && ["EOS_MESSAGE_LIMIT_REACHED", "EOS_SUBSCRIPTION_INACTIVE"].includes(error.code);\n        const respuestaError = commercialError\n          ? error.message\n          : "Ahora mismo no pude conectarme correctamente. Probá nuevamente en unos segundos.";\n\n        const mensajeError: Mensaje = {\n          id: crearIdMensaje(commercialError ? "plan" : "error"),\n          rol: "eos",\n          texto: respuestaError,\n          estado: commercialError ? "completado" : "error",\n          tipo: "texto",\n          accion: commercialError ? "ABRIR_PLANES" : "RESPONDER",\n          creado_en: new Date().toISOString(),\n        };\n'''
          if old not in text:
            raise SystemExit('catch marker missing')
          text = text.replace(old, new, 1)

          marker = '''        setHistorial((actual) => [...actual, mensajeError]);\n      } finally {\n'''
          replacement = '''        setHistorial((actual) => [...actual, mensajeError]);\n        if (commercialError) {\n          window.dispatchEvent(new Event("eos:usage-changed"));\n        }\n      } finally {\n'''
          if marker not in text:
            raise SystemExit('commercial refresh marker missing')
          text = text.replace(marker, replacement, 1)

          path.write_text(text)
          PY

      - name: Patch PlanUsageCard quota scope and direct refresh event
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('app/eos/components/PlanUsageCard.tsx')
          text = path.read_text()

          text = text.replace(
            '''  usage: UsageItem[];\n};\n''',
            '''  usage: UsageItem[];\n  messageQuotaScope: "daily" | "monthly" | null;\n};\n''',
            1,
          )
          text = text.replace(
            '''  usage: [],\n};\n''',
            '''  usage: [],\n  messageQuotaScope: null,\n};\n''',
            1,
          )

          marker = '''  const visibleUsage = commercial.usage.length\n'''
          effect = '''  useEffect(() => {\n    if (!userId) return;\n\n    const refreshFromChat = () => loadCommercialState(userId, true);\n    window.addEventListener("eos:usage-changed", refreshFromChat);\n\n    return () => {\n      window.removeEventListener("eos:usage-changed", refreshFromChat);\n    };\n  }, [loadCommercialState, userId]);\n\n'''
          if marker not in text:
            raise SystemExit('visible usage marker missing')
          text = text.replace(marker, effect + marker, 1)

          marker = '''  const usage = objectFrom(root.uso, root.consumo, root.usage, subscription.uso);\n\n  return {\n'''
          replacement = '''  const usage = objectFrom(root.uso, root.consumo, root.usage, subscription.uso);\n  const messageQuota = objectFrom(root.cuota_mensajes);\n  const messageQuotaScope = stringFrom(messageQuota.scope);\n\n  return {\n'''
          if marker not in text:
            raise SystemExit('quota normalize marker missing')
          text = text.replace(marker, replacement, 1)

          marker = '''    usage: buildUsageItems(usage, limits),\n  };\n}\n\nfunction buildUsageItems(usage: AnyObject, limits: AnyObject): UsageItem[] {\n'''
          replacement = '''    usage: buildUsageItems(\n      usage,\n      limits,\n      messageQuotaScope === "daily" || messageQuotaScope === "monthly"\n        ? messageQuotaScope\n        : null,\n    ),\n    messageQuotaScope:\n      messageQuotaScope === "daily" || messageQuotaScope === "monthly"\n        ? messageQuotaScope\n        : null,\n  };\n}\n\nfunction buildUsageItems(\n  usage: AnyObject,\n  limits: AnyObject,\n  messageQuotaScope: "daily" | "monthly" | null,\n): UsageItem[] {\n'''
          if marker not in text:
            raise SystemExit('buildUsage signature marker missing')
          text = text.replace(marker, replacement, 1)

          marker = '''      label: "Mensajes",\n'''
          replacement = '''      label:\n        messageQuotaScope === "daily"\n          ? "Mensajes hoy"\n          : messageQuotaScope === "monthly"\n            ? "Mensajes este mes"\n            : "Mensajes",\n'''
          if marker not in text:
            raise SystemExit('message label marker missing')
          text = text.replace(marker, replacement, 1)

          path.write_text(text)
          PY

      - name: Verify client quota integration
        run: |
          grep -F 'EOSApiError' app/eos/hooks/useChat.ts
          grep -F 'const requestId = crypto.randomUUID()' app/eos/hooks/useChat.ts
          grep -F 'requestId,' app/eos/hooks/useChat.ts
          grep -F 'EOS_MESSAGE_LIMIT_REACHED' app/eos/hooks/useChat.ts
          grep -F 'eos:usage-changed' app/eos/hooks/useChat.ts
          grep -F 'eos:usage-changed' app/eos/components/PlanUsageCard.tsx
          grep -F 'Mensajes hoy' app/eos/components/PlanUsageCard.tsx
          grep -F 'Mensajes este mes' app/eos/components/PlanUsageCard.tsx

      - name: Commit client patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/eos/hooks/useChat.ts app/eos/components/PlanUsageCard.tsx
          git commit -m 'feat(commercial): surface message quota in chat and usage card'
          git push origin HEAD:agent/eos-rc1-message-quota-v40
