name: RC1 Dependency Audit Temp

on:
  push:
    branches:
      - release/eos-4.0-rc1
    paths:
      - .github/workflows/rc1-dependency-audit-temp.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        shell: bash
        run: |
          npm audit --omit=dev --json > audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit.json','utf8'));
          console.log('AUDIT_METADATA=' + JSON.stringify(audit.metadata || {}));
          const vulns = audit.vulnerabilities || {};
          for (const [name, value] of Object.entries(vulns)) {
            console.log('AUDIT_VULN=' + JSON.stringify({
              name,
              severity: value.severity,
              isDirect: value.isDirect,
              via: value.via,
              effects: value.effects,
              range: value.range,
              nodes: value.nodes,
              fixAvailable: value.fixAvailable,
            }));
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: rc1-dependency-audit
          path: audit.json
          retention-days: 1
