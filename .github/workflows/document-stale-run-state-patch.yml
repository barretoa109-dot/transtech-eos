name: Document Stale Run State Patch

on:
  push:
    branches:
      - agent/eos-rc1-document-analysis-atomic-v29
    paths:
      - .github/workflows/document-stale-run-state-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/eos-rc1-document-analysis-atomic-v29
          fetch-depth: 0

      - name: Preserve document state for stale run rejection
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('app/api/documents/[id]/analyze/route.ts')
          text = path.read_text()
          old = '''      if (document.intelligence_status !== "ready") {\n        await supabase\n          .from("eos_documents_v11")\n          .update({ intelligence_status: "error" })\n          .eq("id", document.id)\n          .eq("usuario_id", user.id);\n      }\n'''
          new = '''      const analysisErrorMessage =\n        analysisError instanceof Error\n          ? analysisError.message\n          : analysisError && typeof analysisError === "object" && "message" in analysisError\n            ? String((analysisError as { message?: unknown }).message || "")\n            : "";\n      const staleAnalysisRun = analysisErrorMessage.includes("EOS_STALE_ANALYSIS_RUN");\n\n      if (!staleAnalysisRun && document.intelligence_status !== "ready") {\n        await supabase\n          .from("eos_documents_v11")\n          .update({ intelligence_status: "error" })\n          .eq("id", document.id)\n          .eq("usuario_id", user.id);\n      }\n'''
          if old not in text:
            raise SystemExit('stale-state snippet not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify stale-run state behavior
        run: |
          grep -F 'staleAnalysisRun' 'app/api/documents/[id]/analyze/route.ts'
          grep -F 'EOS_STALE_ANALYSIS_RUN' 'app/api/documents/[id]/analyze/route.ts'
          grep -F '!staleAnalysisRun && document.intelligence_status !== "ready"' 'app/api/documents/[id]/analyze/route.ts'

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/api/documents/[id]/analyze/route.ts'
          git commit -m 'fix(documents): preserve state when stale analysis loses race'
          git push origin HEAD:agent/eos-rc1-document-analysis-atomic-v29
