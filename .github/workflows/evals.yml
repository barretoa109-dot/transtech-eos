# La hoja de ruta pide que los evals corran "en cada deploy".
#
# Corren acá y no en el `build` de Vercel a propósito: el corredor ejecuta
# TypeScript directo con `node`, algo que Node 24 hace solo y Node 22 no.
# Meterlo en `npm run build` ataría cada deploy del sitio a la versión de Node
# que Vercel decida usar — y un cambio de versión del proveedor dejaría a EOS
# sin poder desplegar por un motivo que no tiene nada que ver con EOS.
#
# Como Vercel despliega desde git, correr en cada push a main es, en la
# práctica, correr en cada deploy — sin poner el sitio de rehén.

name: evals

on:
  push:
    branches: [main]
  pull_request:

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # Los tests protegen las funciones; los evals protegen las respuestas.
      - run: npm test
      - run: npm run evals

      # La auditoría por mutación NO corre acá: rompe el código a propósito
      # para comprobar que el corpus lo note, y sus fragmentos se desactualizan
      # apenas alguien reescribe una línea. Es un chequeo manual
      # (`npm run evals:mutacion`) que se corre al agregar casos nuevos.

      # ============================================================
      # Tipos y lint: los dos bloquean
      # ============================================================
      #
      # `tsc` tiene que pasar: el build de Next lo corre igual, así que un error
      # de tipos ya rompe el despliegue. Adelantarlo acá solo hace que se entere
      # antes quien abrió el PR.
      #
      # `lint` no puede exigir cero todavía: quedan 24 errores heredados, casi
      # todos JSON de Bancard sin contrato de tipos, y bloquear por ellos
      # frenaría trabajo que no tiene nada que ver.
      #
      # Antes eso se resolvía con `continue-on-error: true` y un comentario que
      # decía "para que deje de crecer en silencio". No servía: un chequeo que
      # informa y no bloquea no impide que crezca, solo lo deja anotado en un
      # log que nadie abre.
      #
      # `lint:tope` sí lo impide. Compara contra el número de hoy y falla si
      # sube — y también si baja, pidiendo que se baje el tope, para que ese
      # número no pueda mentir sobre el estado real. La deuda solo puede
      # achicarse, y cada vez que se achica queda el commit que lo prueba.
      #
      # El día que llegue a cero se borra el script y esto vuelve a ser
      # `npm run lint` a secas.
      - run: npx tsc --noEmit
      - run: npm run lint:tope
      # Que las migraciones puedan correr desde cero. No reemplaza aplicarlas
      # en un proyecto limpio: encuentra las formas de romper el orden que se
      # ven sin ejecutar nada, que son las que no se notan hasta reconstruir.
      - run: npm run migraciones
      # Que el modo oscuro no se rompa de a un color por vez. Un `#fff` escrito
      # a mano en una regla nueva se ve idéntico en claro y deja una mancha
      # blanca en la pantalla negra de alguien: es exactamente el tipo de bug
      # que nadie encuentra revisando el diff.
      - run: npm run tema
      # Que ninguna ruta lea con service_role sin decir de quién son los datos.
      # `adminSinTipos()` no pasa por RLS: el filtro que escribe cada ruta ES la
      # seguridad, y un `.eq("usuario_id", …)` olvidado devuelve las filas de
      # todos con un 200 y sin un error en ningún log. Probado en rojo: se le
      # sacó el filtro a una ruta real y falló señalando archivo, línea y tabla.
      - run: npm run rutas

      # Que ninguna consulta a la plata mezcle el negocio con la persona.
      # `eos_movimientos_financieros` y `eos_finanzas_fijos` guardan las dos, y
      # una consulta sin `.eq("ambito", …)` las suma en silencio: el panel de
      # "¿estoy bien?" pasa a incluir la inversión de un negocio, y el resultado
      # del negocio pasa a incluir el sueldo de la persona. Los dos números
      # quedan mal y los dos siguen pareciendo números.
      - run: npm run ambito
