name: Temporary Score Timezone Guard

on:
  push:
    branches:
      - release/eos-4.0-rc1
    paths:
      - .github/workflows/temp-score-timezone.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/eos-4.0-rc1
          fetch-depth: 0

      - name: Apply exact timezone patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/eos/components/DashboardView.tsx")
          text = path.read_text()
          old = 'new Date(intelligence.calculated_at).toLocaleString("es-PY", { dateStyle: "short", timeStyle: "short" })'
          new = 'new Date(intelligence.calculated_at).toLocaleString("es-PY", { dateStyle: "short", timeStyle: "short", timeZone: "America/Asuncion" })'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one timestamp formatter, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          test -n "$(git status --porcelain app/eos/components/DashboardView.tsx)"

      - name: Commit timezone patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/eos/components/DashboardView.tsx
          git commit -m "fix(score): format semantic timestamp in Paraguay [skip score-tz]"
          git push origin HEAD:release/eos-4.0-rc1
