name: RC Fix Plans Payment Copy

on:
  push:
    branches:
      - release/eos-4.0-rc1
    paths:
      - .github/workflows/rc-fix-plans-copy.yml

permissions:
  contents: write

jobs:
  fix-copy:
    if: ${{ !contains(github.event.head_commit.message, '[skip plans-copy-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/eos-4.0-rc1
          fetch-depth: 0

      - name: Replace inaccurate payment copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/planes/page.tsx')
          text = path.read_text()
          old = '''            <span className="plans-section-label">ACTUALIZACIÓN AUTOMÁTICA</span>
            <h2>Tu acceso cambia en cuanto el pago es confirmado.</h2>
            <p>
              No necesitás esperar una aprobación manual. La confirmación
              segura del proveedor de pago actualizará el plan, los límites
              y las funciones disponibles en EOS.
            </p>'''
          new = '''            <span className="plans-section-label">ACTIVACIÓN SEGURA</span>
            <h2>Tu acceso cambia cuando TransTech confirma el pago.</h2>
            <p>
              En pagos por transferencia, el comprobante pasa por revisión
              antes de activar el plan. Una vez confirmado, EOS actualiza tus
              límites y funciones disponibles.
            </p>'''
          if old not in text:
              raise SystemExit('Expected plans copy not found; refusing broad rewrite')
          path.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          git diff -- app/planes/page.tsx

      - name: Commit exact copy fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/planes/page.tsx
          git commit -m 'fix(plans): describe manual transfer review accurately [skip plans-copy-fix]'
          git push origin HEAD:release/eos-4.0-rc1
